  for(const [cx,cy] of [[x+r,y+r],[x+w-r,y+r],[x+r,y+h-r],[x+w-r,y+h-r]]){

  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill(); ctx.globalAlpha=1; }

function text(str,x,y,s,color,align){
  str=String(str).toUpperCase(); ctx.fillStyle=color;
  let tw=0; for(const ch of str) tw+=4*s; tw-=s;
  if(align==='center') x-=Math.floor(tw/2);

  for(const ch of str){ const g=FONT[ch]||FONT[' '];
    for(let r=0;r<5;r++) for(let c=0;c<3;c++)
      if(g[r][c]==='#') ctx.fillRect(x+c*s,y+r*s,s,s);
    x+=4*s; } }

/* ================= AUDIO (procedural, Web Audio) ================= */
let AC=null, muted=false;
function audio(){ // create/resume on user gesture
  try{
    if(!AC){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; AC=new A(); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function noiseBuf(ac,dur){
  const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function sWhoosh(){
  const ac=audio(); if(!ac||muted) return;
  try{
    const t=ac.currentTime, src=ac.createBufferSource(); src.buffer=noiseBuf(ac,0.16);
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2;
    f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(2600,t+0.14);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t); src.stop(t+0.18);
  }catch(e){}
}
function sHitCrisp(){ // PLAYER lands a punch: crisp, higher
  const ac=audio(); if(!ac||muted) return;
  try{
    const t=ac.currentTime;
    const n=ac.createBufferSource(); n.buffer=noiseBuf(ac,0.09);
    const hf=ac.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=1400;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(0.5,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    n.connect(hf); hf.connect(ng); ng.connect(ac.destination); n.start(t); n.stop(t+0.1);
    const o=ac.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(170,t+0.1);
    const og=ac.createGain();
    og.gain.setValueAtTime(0.5,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t+0.13);
  }catch(e){}
}
function sHitHeavy(){ // PLAYER gets hit: heavier, lower thud
  const ac=audio(); if(!ac||muted) return;
  try{
    const t=ac.currentTime;
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+0.26);
    const og=ac.createGain();
    og.gain.setValueAtTime(0.7,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t+0.32);
    const n=ac.createBufferSource(); n.buffer=noiseBuf(ac,0.2);
    const lf=ac.createBiquadFilter(); lf.type='lowpass'; lf.frequency.value=320;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(0.5,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    n.connect(lf); lf.connect(ng); ng.connect(ac.destination); n.start(t); n.stop(t+0.22);
  }catch(e){}
}
function sBlock(){ // blocked punch: distinct mid "thock" (not hit-landed, not hit-taken)
  const ac=audio(); if(!ac||muted) return;
  try{
    const t=ac.currentTime;
    const n=ac.createBufferSource(); n.buffer=noiseBuf(ac,0.07);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=850; bp.Q.value=2;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(0.45,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    n.connect(bp); bp.connect(ng); ng.connect(ac.destination); n.start(t); n.stop(t+0.09);
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(210,t); o.frequency.exponentialRampToValueAtTime(95,t+0.1);
    const og=ac.createGain();
    og.gain.setValueAtTime(0.4,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t+0.13);
  }catch(e){}
}
function sThud(){ // knockdown: heavy canvas thud
  const ac=audio(); if(!ac||muted) return;
  try{
    const t=ac.currentTime;
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(75,t); o.frequency.exponentialRampToValueAtTime(30,t+0.5);
    const og=ac.createGain();
    og.gain.setValueAtTime(0.9,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t+0.6);
    const n=ac.createBufferSource(); n.buffer=noiseBuf(ac,0.35);
    const lf=ac.createBiquadFilter(); lf.type='lowpass'; lf.frequency.value=170;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(0.6,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    n.connect(lf); lf.connect(ng); ng.connect(ac.destination); n.start(t); n.stop(t+0.4);
  }catch(e){}
}
function sBeep(){ // ref count tick
  const ac=audio(); if(!ac||muted) return;
  try{
    const t=ac.currentTime, o=ac.createOscillator(); o.type='square'; o.frequency.value=880;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.1);

function sBell(){ // round start
  const ac=audio(); if(!ac||muted) return;
  try{
    const t=ac.currentTime;
    for(const f of [660,990]){
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=ac.createGain();
      g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.2);
    }
  }catch(e){}
}

/* ---------- input: touch ---------- */
const BTN = { // Xbox diamond, right side
  Y:{x:398,y:150,c:'#9c8426',p:'straight'},
  X:{x:354,y:196,c:'#2f5f9e',p:'jab'},
  B:{x:442,y:196,c:'#96333a',p:'hookR'},
  A:{x:398,y:242,c:'#3a7d44',p:'hookL'},
  r:24,   // touch hit radius (generous)
  vr:15   // visual radius (compact)
};
const BLK={x:376,y:219,r:17,vr:10}; // BLOCK button (hold): between X and A
const MUTE={x:446,y:42,w:26,h:18};
let joyId=null, joyAX=0, joyAY=0, joyDX=0, joyDY=0, joyActive=false;
const btnTouch={}; // key -> touch id currently pressing
const blkTouchIds=new Set(); // touch ids LOCKED to BLOCK for their whole life: a touch that starts on BLK can never fire a punch
let blkMouse=false; // desktop mouse holding BLOCK
let blkKey=false;   // keyboard holding BLOCK
function blkHeld(){ return blkTouchIds.size>0||blkMouse||blkKey; } // any live block hold
function syncBlock(){ if(typeof player!=='undefined'&&player) player.blocking=blkHeld(); } // blocking derived from live holds — never cleared spuriously
function toGame(e){
  const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
}
function tryPunch(f,key){
  if(phase!=='fight'||f.down||f.punch||f.st<4||f.blocking||f.getUpT>0) return;
  if(f.isPlayer&&blkHeld()) return; // belt and suspenders: holding BLK can NEVER punch, even if the flag lagged
  const P=PUNCHES[key];
  f.st=Math.max(0,f.st-P.cost);
  f.punch={key,t:P.dur,dur:P.dur,hitDone:false};
  sWhoosh();
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault(); audio();
  for(const t of e.changedTouches){
    const p=toGame(t);
    if(phase==='over'){ continue; }
    // mute button
    if(p.x>=MUTE.x&&p.x<=MUTE.x+MUTE.w&&p.y>=MUTE.y&&p.y<=MUTE.y+MUTE.h){ muted=!muted; continue; }
    // block button (hold) — between X and A, checked first for priority
    { const dx=p.x-BLK.x, dy=p.y-BLK.y;
      if(dx*dx+dy*dy<=BLK.r*BLK.r){ blkTouchIds.add(t.identifier); player.blocking=true; continue; } }
    // diamond buttons
    let hitBtn=null;
    for(const k of ['Y','X','B','A']){
      const b=BTN[k], dx=p.x-b.x, dy=p.y-b.y;
      if(dx*dx+dy*dy<=BTN.r*BTN.r){ hitBtn=k; break; }
    }
    if(hitBtn){ btnTouch[hitBtn]=t.identifier; tryPunch(player,BTN[hitBtn].p); continue; }
    // joystick zone (left half)
    if(p.x<240&&joyId===null){ joyId=t.identifier; joyAX=p.x; joyAY=p.y; joyDX=0; joyDY=0; joyActive=true; }
  }
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const p=toGame(t);
      let dx=p.x-joyAX, dy=p.y-joyAY;
      const d=Math.hypot(dx,dy), max=34;
      if(d>max){ dx=dx/d*max; dy=dy/d*max; }
      joyDX=dx/max; joyDY=dy/max;
    }
  }
},{passive:false});
function touchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyId){ joyId=null; joyDX=0; joyDY=0; joyActive=false; }
    blkTouchIds.delete(t.identifier); // release of a BLK-locked touch (touchcancel handled the same)
    for(const k in btnTouch) if(btnTouch[k]===t.identifier) delete btnTouch[k];
  }
  syncBlock(); // recompute from live holds — a stray end/cancel never kills an active hold
}
cv.addEventListener('touchend',touchEnd); cv.addEventListener('touchcancel',touchEnd);
// mouse support for desktop testing of buttons
cv.addEventListener('mousedown',function(e){
  audio();
  const p=toGame(e);
  if(p.x>=MUTE.x&&p.x<=MUTE.x+MUTE.w&&p.y>=MUTE.y&&p.y<=MUTE.y+MUTE.h){ muted=!muted; return; }
  { const dx=p.x-BLK.x, dy=p.y-BLK.y;
    if(dx*dx+dy*dy<=BLK.r*BLK.r){ blkMouse=true; player.blocking=true; return; } }
  for(const k of ['Y','X','B','A']){
    const b=BTN[k], dx=p.x-b.x, dy=p.y-b.y;
    if(dx*dx+dy*dy<=BTN.r*BTN.r){ tryPunch(player,BTN[k].p); return; }
  }
});
addEventListener('mouseup',function(){ blkMouse=false; syncBlock(); });
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); }); // no long-press menu stealing the hold

/* ---------- input: keyboard ---------- */
const keys={};
addEventListener('keydown',function(e){
  audio();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if(phase!=='fight') {
    if(e.key.toLowerCase()==='r'&&phase==='over') reset();
    if(e.key.toLowerCase()==='m') muted=!muted;
    return;
  }
  const k=e.key.toLowerCase();
  if(k==='m'){ muted=!muted; return; }
  if(k===' '||k==='l'){ blkKey=true; player.blocking=true; return; }
  if(k==='j') tryPunch(player,'jab');
  else if(k==='k') tryPunch(player,'straight');
  else if(k==='u') tryPunch(player,'hookL');
  else if(k==='i') tryPunch(player,'hookR');
});
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false;
  if(e.key===' '||e.key.toLowerCase()==='l'){ blkKey=false; syncBlock(); } });
function keyMove(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft']) x-=1;
  if(keys['d']||keys['arrowright']) x+=1;
  if(keys['w']||keys['arrowup']) y-=1;
  if(keys['s']||keys['arrowdown']) y+=1;
  return {x,y};
}

/* ================= UPDATE ================= */
function dist(a,b){ return Math.hypot(a.x-b.x,(a.y-b.y)*1.6); }
function throwAI(){
  if(ai.down||ai.punch||ai.st<4||phase!=='fight') return;
  const opts=['jab','jab','straight','straight','hookL','hookR'];
  tryPunch(ai,opts[(Math.random()*opts.length)|0]);
}
function aiThink(dt){
  ai.think=(ai.think==null?0.4:ai.think)-dt;
  if(!(ai.moveT>0)){ ai.mvx=0; ai.mvy=0; } else ai.moveT-=dt;
  if(ai.retreat>0){ // backing off to recover stamina
    ai.retreat-=dt;
    ai.mvx=(ai.x<player.x?-1:1)*0.7;
    ai.mvy=(ai.y<player.y?-1:1)*0.4; ai.moveT=0.2;
    if(ai.st>50) ai.retreat=0;
    return;
  }
  if(ai.st<22){ ai.retreat=1.2+Math.random(); return; }
  if(ai.think>0) return;
  ai.think=0.45+Math.random()*0.6;
  const d=dist(ai,player);
  if(d>68){ // stalk: close distance, align vertically
    ai.mvx=(player.x>ai.x?1:-1);
    ai.mvy=Math.abs(player.y-ai.y)>6?(player.y>ai.y?1:-1)*0.7:0;
    ai.moveT=0.3;
  } else { // in range: sometimes punch, then reposition
    if(Math.random()<0.35) throwAI();
    const r2=Math.random();
    if(r2<0.5) ai.mvx=(ai.x<player.x?-1:1)*0.7;                 // back off
    else if(r2<0.75){ ai.mvy=(Math.random()<0.5?-1:1)*0.8;     // circle
      ai.mvx=(player.x>ai.x?0.2:-0.2); }
    else ai.mvx=(player.x>ai.x?0.5:-0.5);                       // press in
    ai.moveT=0.4;
  }
}
function moveFighter(f,dt){
  if(f.punch){ f.mvx*=0.3; f.mvy*=0.3; }
  const sp=f.speed*(f.down?0:1);
  f.x+=f.mvx*sp*dt; f.y+=f.mvy*sp*dt;
  f.x=Math.max(RING.x0,Math.min(RING.x1,f.x));
  f.y=Math.max(RING.y0,Math.min(RING.y1,f.y));
  f.moving=(Math.abs(f.mvx)+Math.abs(f.mvy))>0.05;
  if(f.moving) f.bobT+=dt*1.6; else f.bobT+=dt*0.5;
}
function separate(){
  // fighters can't pass through each other — soft minimum infighting distance
  const dx=ai.x-player.x, adx=Math.abs(dx);
  if(adx<50&&(Math.abs(ai.y-player.y)<30)){
    const push=(50-adx)/2, s=dx>=0?1:-1;
    player.x-=push*s; ai.x+=push*s;
    player.x=Math.max(RING.x0,Math.min(RING.x1,player.x));
    ai.x=Math.max(RING.x0,Math.min(RING.x1,ai.x));
  }
}
function updatePunch(f,foe,dt){
  if(!f.punch) return;
  const P=PUNCHES[f.punch.key];
  f.punch.t-=dt;
  if(!f.punch.hitDone&&f.punch.t<=P.dur*0.45){
    f.punch.hitDone=true;
    if(phase==='fight'&&dist(f,foe)<P.range&&!foe.down){
      const ix=(f.x+foe.x)/2, iy=(f.y+foe.y)/2-46;
      const blocked=foe.blocking&&!foe.guardBroken&&foe.st>0;
      if(blocked){
        // BLOCKED: auto-blocks high and low — no health damage, stamina drained per impact
        foe.st=Math.max(0,foe.st-(P.dmg+6));
        for(let i=0;i<6;i++){
          const a=Math.random()*Math.PI*2, sp=30+Math.random()*50;
          sparks.push({x:ix,y:iy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:0.2,max:0.2,
            c:['#bfe9ff','#7fd8ff','#ffffff'][(Math.random()*3)|0]});
        }
        shake=Math.max(shake,3);
        sBlock();
        if(foe.st<=0) foe.guardBroken=true; // guard fails until stamina recovers
      } else {
        // HIT
        foe.hp=Math.max(0,foe.hp-P.dmg);
        foe.st=Math.max(0,foe.st-6);
        foe.hitT=0.3; // hit-reaction animation
        for(let i=0;i<12;i++){
          const a=Math.random()*Math.PI*2, sp=40+Math.random()*90;
          sparks.push({x:ix,y:iy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:0.28,max:0.28,
            c:['#ffffff','#ffe36e','#ff9a3d','#ff4d4d'][(Math.random()*4)|0]});
        }
        shake=7; freeze=0.07;
        if(f.isPlayer) sHitCrisp(); else sHitHeavy();
        if(foe.hp<=0) startKnockdown(foe,f);
      }
    }
  }
  if(f.punch.t<=0) f.punch=null;
}
function startKnockdown(downed,aggressor){
  downed.down=true; downed.downT=0; downed.knockdowns++;
  downed.punch=null;
  sThud();
  shake=10;
  phase='count'; count=0; countT=0;
  ref.targetX=downed.x+(downed.x<240?36:-36);
  // aggressor to neutral corner
  aggressor.cornerX=aggressor.x<240?RING.x1-20:RING.x0+20;
  downed.getUpAt=downed.knockdowns>=3?99:7; // 3rd knockdown = stays down
}
function update(dt){
  if(freeze>0){ freeze-=dt; return; }
  // animation timers
  for(const f of [player,ai]){
    if(f.hitT>0) f.hitT-=dt;
    if(f.getUpT>0) f.getUpT-=dt;
  }
  // smooth HUD bars
  for(const f of [player,ai]){
    f.hpShow+=(f.hp/100-f.hpShow)*Math.min(1,dt*6);
    f.stShow+=(f.st/100-f.stShow)*Math.min(1,dt*6);
  }
  if(shake>0) shake=Math.max(0,shake-dt*30);
  // sparks / flashes
  for(const s of sparks){ s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=160*dt; }
  sparks=sparks.filter(s=>s.life>0);
  for(const f of flashes) f.life-=dt;
  flashes=flashes.filter(f=>f.life>0);

  if(phase==='intro'){
    phaseT-=dt;
    if(phaseT<=0){ phase='fight'; }
  } else if(phase==='fight'){
    clock-=dt;
    // player input
    const km=keyMove();
    player.mvx=(joyDX!==0?joyDX:km.x); player.mvy=(joyDY!==0?joyDY:km.y);
    const ml=Math.hypot(player.mvx,player.mvy);
    if(ml>1){ player.mvx/=ml; player.mvy/=ml; }
    aiThink(dt);
    moveFighter(player,dt); moveFighter(ai,dt);
    separate();
    player.facing=ai.x>=player.x?1:-1;
    ai.facing=player.x>=ai.x?1:-1;
    // stamina regen
    for(const f of [player,ai]){ if(!f.punch) f.st=Math.min(100,f.st+13*dt);
      if(f.guardBroken&&f.st>=30) f.guardBroken=false; } // guard restored once stamina recovers
    updatePunch(player,ai,dt); updatePunch(ai,player,dt);
    // ref follows action
    const mid=(player.x+ai.x)/2;
    ref.targetX=Math.max(70,Math.min(410,mid+62));
    if(clock<=0){ clock=0; doDecision(); }
  } else if(phase==='count'){
    countT+=dt;
    // downed falls / lies
    const downed=player.down?player:ai, agg=player.down?ai:player;
    downed.downT+=dt;
    // aggressor walks to neutral corner
    if(agg.cornerX!=null){
      const dx=agg.cornerX-agg.x;
      agg.mvx=Math.abs(dx)>4?Math.sign(dx):0; agg.mvy=0;
      moveFighter(agg,dt); agg.mvx=0;
      agg.facing=downed.x>=agg.x?1:-1;
    }
    // ref moves to downed fighter
    // count 1..10, ~0.85s apart
    const n=Math.min(10,1+((countT/0.85)|0));
    if(n>count){ count=n; sBeep(); }
    if(downed.getUpAt<=count&&!downed.down){ /* already up */ }
    if(count>=downed.getUpAt&&downed.down&&downed.knockdowns<3){
      downed.down=false; downed.downT=0; downed.hp=45; downed.st=55;
      downed.getUpT=0.55; // get-up animation plays, no punches meanwhile
      downed.x=Math.max(RING.x0,Math.min(RING.x1,downed.x));
      agg.cornerX=null;
      phase='fight'; count=0;
    }
    if(count>=10&&downed.down){
      winner=agg.isPlayer?'MAURICE TREMAINE':'MUSA KARIF AHMED';
      phase='over'; phaseT=0; winnerBy='KNOCKOUT';
    }
  }
  // ref movement smoothing (all phases)
  if(ref.targetX==null) ref.targetX=ref.x;
  ref.x+=(ref.targetX-ref.x)*Math.min(1,dt*3);
  ref.y=232+Math.sin(performance.now()/1000*1.4)*1.5;
}
function doDecision(){
  phase='over'; winnerBy='DECISION';
  winner=player.hp>=ai.hp?'MAURICE TREMAINE':'MUSA KARIF AHMED';
}

/* ================= RENDER ================= */
/* ---------- animation: sprite-sheet state machine ---------- */
const FR={idle:[0,1,2,3],walk:[4,5,6,7],
  jab:[8,9,10],straight:[11,12,13],hookL:[14,15,16],hookR:[17,18,19],
  block:[20,21],hit:[22,23],fall:[24,25,26,27],getup:[28,29]};
const PANIM={jab:'jab',straight:'straight',hookL:'hookL',hookR:'hookR'};
function sliceSheet(img){
  const cw=76,ch=104,cells=[];
  for(let i=0;i<32;i++){
    const c=document.createElement('canvas'); c.width=cw; c.height=ch;
    c.getContext('2d').drawImage(img,(i%8)*cw,((i/8)|0)*ch,cw,ch,0,0,cw,ch);
    cells.push(c);
  }
  return cells;
}
function pickCell(f){
  if(f.down){ // knockdown fall -> lying
    return FR.fall[Math.min(3,(f.downT/0.6*4)|0)];
  }
  if(f.getUpT>0){ // getting up
    return FR.getup[Math.min(1,(((0.55-f.getUpT)/0.55)*2)|0)];
  }
  if(f.punch){ // punch animations, distinct per punch
    const A=FR[PANIM[f.punch.key]], pr=1-f.punch.t/f.punch.dur;
    return A[Math.min(A.length-1,(pr*A.length)|0)];
  }
  if(f.blocking) return FR.block[(f.bobT*6|0)%2]; // guard pose while BLK held
  if(f.hitT>0) return FR.hit[(f.hitT*12|0)%2]; // hit reaction
  if(f.moving) return FR.walk[(f.bobT*9|0)%4]; // legs step while moving
  return FR.idle[(f.bobT*4.5|0)%4]; // boxer's bounce, arms free
}
function drawFighter(f){
  if(!f.cells) f.cells=sliceSheet(f.img); // sliced once, after sprites load
  const cell=f.cells[pickCell(f)];
  const bob=f.moving?Math.abs(Math.sin(f.bobT*9))*1.6:Math.sin(f.bobT*2.2)*0.8;
  let lx=f.x;
  if(f.punch){ const pr=1-f.punch.t/f.punch.dur; lx+=Math.sin(pr*Math.PI)*8*f.facing; }
  ellipse(f.x,f.y+1,22,4,'#000',0.3); // shadow stays planted
  ctx.save();
  ctx.translate(Math.round(lx),Math.round(f.y-bob));
  ctx.scale(f.facing*f.flipBase,1);
  ctx.drawImage(cell,-38,-104);
  ctx.restore();
  if(f.isPlayer&&f.blocking){ // guard indicator: shield bubble (red when guard is broken)
    ctx.strokeStyle=f.guardBroken?'rgba(255,90,90,0.30)':'rgba(127,216,255,0.38)';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(f.x,f.y-54,27,42,0,0,7); ctx.stroke();
  }
}
function drawRefSpr(){
  const img=SPR.r, targetH=86;
  const sc=targetH/img.height, w=img.width*sc;
  const sway=Math.sin(performance.now()/1000*1.4)*1.5;
  ellipse(ref.x+sway,ref.y+1,15,3,'#000',0.35);
  ctx.drawImage(img,Math.round(ref.x+sway-w/2),Math.round(ref.y-targetH),Math.round(w),Math.round(targetH));
}
function drawTouchUI(){
  // joystick hint / active
  if(joyActive){
    ctx.globalAlpha=0.5;
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(joyAX,joyAY,24,0,7); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(joyAX+joyDX*24,joyAY+joyDY*24,10,0,7); ctx.fill();
    ctx.globalAlpha=1;
  } else {
    ctx.globalAlpha=0.28;
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(92,206,22,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // diamond buttons
  for(const k of ['Y','X','B','A']){
    const b=BTN[k], pressed=btnTouch[k]!=null;
    ctx.globalAlpha=pressed?1:0.82;
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(b.x,b.y,BTN.vr+3,0,7); ctx.fill();
    ctx.fillStyle=b.c;
    ctx.beginPath(); ctx.arc(b.x,b.y,BTN.vr,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(b.x-4,b.y-5,6,Math.PI,0); ctx.fill();
    ctx.globalAlpha=1;
    textOutline(k,b.x,b.y-7,3,'#fff','center');
  }
  // block button (hold) — between X and A
  { const pressed=blkTouchIds.size>0;
    ctx.globalAlpha=pressed?1:0.85;
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(BLK.x,BLK.y,BLK.vr+3,0,7); ctx.fill();
    ctx.fillStyle=pressed?'#8fb8dd':'#4a6a8a';
    ctx.beginPath(); ctx.arc(BLK.x,BLK.y,BLK.vr,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(BLK.x-3,BLK.y-4,4,Math.PI,0); ctx.fill();
    ctx.globalAlpha=1;
    textOutline('BLK',BLK.x,BLK.y-4,2,'#fff','center');
  }
  // mute button
  px(MUTE.x,MUTE.y,MUTE.w,MUTE.h,muted?'#5a1f1f':'#1d2b1d');
  px(MUTE.x,MUTE.y,MUTE.w,1,'#4a4a58'); px(MUTE.x,MUTE.y+MUTE.h-1,MUTE.w,1,'#4a4a58');
  px(MUTE.x,MUTE.y,1,MUTE.h,'#4a4a58'); px(MUTE.x+MUTE.w-1,MUTE.y,1,MUTE.h,'#4a4a58');
  text('SND',MUTE.x+13,MUTE.y+6,1,muted?'#ff6b6b':'#9fe6a0','center');
}
function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawCrowd(); drawRing();
  // depth sort fighters + ref by feetY
  const actors=[
    {y:player.y,d:()=>drawFighter(player)},
    {y:ai.y,d:()=>drawFighter(ai)},
    {y:ref.y,d:drawRefSpr},
  ].sort((a,b)=>a.y-b.y);
  if(SPR.ok) for(const a of actors) a.d();
  drawHUD(player,ai,clock);
  // sparks
  for(const s of sparks){
    ctx.globalAlpha=Math.max(0,s.life/s.max);
    px(s.x-1,s.y-1,3,3,s.c);
  }
  ctx.globalAlpha=1;
  ctx.globalAlpha=1;
  ctx.restore();
  drawTouchUI();
  // phase banners
  if(phase==='intro'){
    textOutline('FIGHT!',240,110,6,'#f5d75e','center');
  } else if(phase==='count'){
    const downed=player.down?player:ai;
    textOutline('DOWN!',240,86,4,'#ff5a5a','center');
    if(count>0) textOutline(String(count),240,130,8,'#ffffff','center');
  } else if(phase==='over'){
    textOutline(winnerBy+'!',240,80,5,'#f5d75e','center');
    textOutline(winner,240,120,3,'#ffffff','center');
    textOutline('WINNER',240,150,3,'#9fe6a0','center');
    textOutline('PRESS R TO REMATCH',240,200,2,'#cfcfd8','center');
  }
}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const rdt=Math.min(0.05,(now-last)/1000); last=now;
  update(rdt);
  render();
  requestAnimationFrame(frame);
}
// debug hooks for headless testing
window.__game={get player(){return player},get ai(){return ai},get phase(){return phase},
  get clock(){return clock},get count(){return count},
  hurtAI(n){ai.hp=Math.max(0,ai.hp-n); if(ai.hp<=0&&phase==='fight') startKnockdown(ai,player);},
  hurtPlayer(n){player.hp=Math.max(0,player.hp-n); if(player.hp<=0&&phase==='fight') startKnockdown(player,ai);},
  setClock(s){clock=s;}, tryPunch, get muted(){return muted}};
requestAnimationFrame(frame);
</script>
